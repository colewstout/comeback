# One-click deploy on Render: New > Blueprint > pick this repo. Render reads this file from the repo root.
# Creates the web app (which also runs the 15-minute message scheduler) and a Postgres database.
databases:
  - name: one-more-time-db
    plan: basic-256mb
    databaseName: onemoretime
    user: onemoretime

services:
  - type: web
    name: one-more-time
    runtime: docker
    rootDir: app
    dockerfilePath: ./app/Dockerfile
    dockerContext: ./app
    plan: starter # always-on; the free plan sleeps, which would pause the scheduler
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase: { name: one-more-time-db, property: connectionString }
      - key: SESSION_SECRET
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      # APP_URL is optional: the app uses its onrender.com address until you add one
      # for a custom domain (e.g. https://app.onemoretime.app).
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_MULTI
        sync: false
      - key: SQUARE_APP_ID
        sync: false
      - key: SQUARE_APP_SECRET
        sync: false
      - key: SQUARE_ENVIRONMENT
        value: production
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
      - key: ADMIN_EMAILS
        sync: false # your email, to see the Admin tab
